# Emulate the SDK the app actually compiles against.
#
# This needs --add-exports=java.base/jdk.internal.access=ALL-UNNAMED (set in
# app/build.gradle.kts). Without it Robolectric's FileDescriptor interceptor cannot reach
# jdk.internal.access.SharedSecrets on JDK 21 and every test fails at sandbox startup with
# "Failed to interact with raw FileDescriptor internals".
sdk=37
