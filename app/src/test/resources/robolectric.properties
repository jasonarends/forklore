# Robolectric emulates API 36 rather than the project's compileSdk of 37.
#
# API 37 initialises com.android.internal.os.ApplicationSharedMemory during application
# startup, and Robolectric 4.17's FileDescriptor interceptor cannot service it on JDK 21
# ("Failed to interact with raw FileDescriptor internals"). Nothing under test here depends
# on API 37 behaviour — these are SQLite and Room tests — so emulating 36 costs nothing.
# Revisit when Robolectric ships a working API 37 sandbox.
sdk=37
