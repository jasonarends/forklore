name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The action's default `packages` is "tools platform-tools", but Google's SDK
      # repository no longer lists `tools`, so the default fails setup before anything
      # builds. AGP fetches platforms and build-tools itself; only platform-tools is needed.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Lint
        run: ./gradlew lint

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: forklore-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
